name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  # Versoes fixas: o conjunto de regras padrao do ruff muda entre releases,
  # entao sem pin o resultado do gate mudaria sem nenhuma alteracao no codigo.
  RUFF_VERSION: '0.16.3'
  BANDIT_VERSION: '1.9.4'
  PYTEST_VERSION: '9.1.1'
  # Centralizado para nao repetir o nome entre o 'docker build' e o
  # 'image-ref' do Trivy no job docker.
  IMAGE_NAME: targeting-service

# Os quatro jobs abaixo nao declaram 'needs', entao rodam em paralelo e cada
# um reporta seu proprio status: uma falha de lint nao impede o security scan
# de executar. Como cada job roda em uma VM propria, todos repetem o checkout
# e o setup do Python.
jobs:
  # --------------------------------------------------------------------
  # BUILD
  # --------------------------------------------------------------------
  # Validacao do lado Python: instalar as dependencias e compilar o codigo.
  # A imagem Docker nao e construida aqui - isso e responsabilidade do job
  # 'docker', que roda depois do agregador.
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configura Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instala as dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 'compileall' valida a sintaxe sem importar o modulo: o app.py abre o
      # pool do Postgres e chama sys.exit(1) em tempo de import.
      - name: Compila o codigo
        run: python -m compileall -q app.py

  # --------------------------------------------------------------------
  # TEST
  # --------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configura Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # As dependencias da app entram aqui porque os testes futuros vao
      # importar o app.py; hoje o scaffold ainda nao usa nenhuma delas.
      - name: Instala as dependencias de teste
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pytest==${PYTEST_VERSION}"

      - name: Executa os testes
        run: |
          # O shell padrao e 'bash -e', entao a saida != 0 do pytest precisa
          # ser capturada para tratarmos o codigo 5 (nenhum teste coletado).
          set +e
          pytest -q
          code=$?
          set -e

          if [ "$code" -eq 5 ]; then
            echo "::warning title=Sem testes::Nenhum teste coletado - o job de teste ainda e um scaffold"
            exit 0
          fi

          exit $code

  # --------------------------------------------------------------------
  # LINT
  # --------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configura Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instala o ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: ruff check
        run: ruff check --output-format=github .

      # '!cancelled()' aqui dentro do job: sem isso, uma falha no 'ruff check'
      # pularia a checagem de formatacao e esconderia metade dos achados.
      - name: ruff format
        if: ${{ !cancelled() }}
        run: ruff format --check --diff .

  # --------------------------------------------------------------------
  # SECURITY SCAN
  # --------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configura Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instala o bandit
        run: pip install "bandit==${BANDIT_VERSION}"

      # SAST do codigo Python. O bandit nao tem nivel CRITICAL (HIGH e o
      # maximo da escala), entao '-lll' e o equivalente mais proximo do
      # gate CRITICAL do Trivy.
      - name: Bandit (SAST)
        run: bandit -r . -lll -x ./venv,./.git

      # SCA (+ secrets e misconfig) com Trivy em modo filesystem.
      # 'exit-code: 1' e o gate: apenas achados CRITICAL reprovam o job.
      # Atencao: o filtro de severidade tambem corta o relatorio, entao
      # achados HIGH ou menores nao aparecem no log.
      - name: Trivy fs (SCA, secrets e misconfig)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table

  # --------------------------------------------------------------------
  # AGREGADOR
  # --------------------------------------------------------------------
  # Check unico para o branch protection do main, no lugar dos quatro.
  #
  # O 'if: always()' e obrigatorio aqui: sem ele, um job dependente que
  # falha faz este job ser *pulado*, e o GitHub trata check pulado como
  # aprovado no branch protection - o merge passaria com a pipeline
  # vermelha. Com 'always()' o job sempre roda e decide no step abaixo.
  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs:
      - build
      - test
      - lint
      - security
    runs-on: ubuntu-latest

    steps:
      - name: Verifica o resultado dos jobs
        run: |
          echo "build    : ${{ needs.build.result }}"
          echo "test     : ${{ needs.test.result }}"
          echo "lint     : ${{ needs.lint.result }}"
          echo "security : ${{ needs.security.result }}"

          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error title=Pipeline reprovada::Ao menos um job nao passou - veja os status acima"
            exit 1
          fi

          echo "Todos os jobs passaram."

  # --------------------------------------------------------------------
  # DOCKER BUILD & SCAN
  # --------------------------------------------------------------------
  # Roda so depois do agregador: nao faz sentido gastar um build de imagem
  # se lint, teste ou SAST ja reprovaram. Como o 'ci-success' falha quando
  # qualquer dependencia falha, e o 'needs' aqui usa o if implicito
  # 'success()', este job e *pulado* nesse caso.
  #
  # IMPORTANTE: este job fica FORA do check agregado do 'ci-success'. Para
  # que ele bloqueie merge, adicione 'Docker Build & Scan' como required
  # check no branch protection do main, ao lado de 'CI Success'.
  docker:
    name: Docker Build & Scan
    needs: ci-success
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build da imagem Docker
        run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      # Scan da imagem: complementa o 'Trivy fs' do job security, que enxerga
      # o codigo e o requirements.txt mas nao os pacotes de SO que vem da
      # imagem base (python:slim).
      #
      # 'ignore-unfixed: true' aqui (diferente do fs scan): a base Debian
      # carrega CVEs sem patch upstream, e reprovar por algo que nao da para
      # corrigir transformaria o gate em ruido permanente.
      - name: Trivy image (scan da imagem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      # -----------------------------------------------------------------
      # Push para o ECR privado - apenas na main, nunca em Pull Request
      # -----------------------------------------------------------------
      # Este bloco antes apontava para o ECR *publico* da conta antiga
      # (public.ecr.aws/y3u9h2f0). A conta nova padroniza ECR *privado* nos
      # cinco servicos: o amazon-ecr-login sem 'registry-type' ja autentica
      # no registry privado da conta, e a regiao deixa de ser fixa em
      # us-east-1 (restricao que so existia para o registry publico).
      - name: Definir SHA curto
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Uma unica tag imutavel v1.0.0-<sha curto>, igual aos outros servicos.
      # O repositorio ECR e criado com IMMUTABLE, entao nada de "latest".
      - name: Tag & push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: v1.0.0-${{ steps.vars.outputs.sha_short }}
        run: |
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

      # -----------------------------------------------------------------
      # GitOps: atualiza a tag no repo raiz; o ArgoCD sincroniza sozinho
      # -----------------------------------------------------------------
      # Precisa do secret GITOPS_PAT: o GITHUB_TOKEN deste repositorio so
      # tem permissao sobre ele mesmo, nao sobre o repo raiz.
      # 'ref: master' porque o repo raiz usa master (os servicos usam main).
      - name: Checkout do repo GitOps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: ProjetoFIAPToggleMaster/toggle-master-microservices
          ref: master
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Atualizar a tag da imagem no repo GitOps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: v1.0.0-${{ steps.vars.outputs.sha_short }}
        run: |
          cd gitops-repo
          sed -i -E "s|(image: .*/${IMAGE_NAME}):.*|\1:${IMAGE_TAG}|" k8s/overlays/prod/patch-images.yaml

          # Reexecutar o mesmo commit nao muda nada no arquivo, e um
          # 'git commit' sem alteracoes falharia - entao saimos antes.
          if git diff --quiet; then
            echo "patch-images.yaml ja aponta para ${IMAGE_TAG}; nada a fazer."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(${IMAGE_NAME}): imagem ${IMAGE_TAG}"
          git push origin master
